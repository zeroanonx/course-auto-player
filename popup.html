<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 286px; margin: 0; padding: 14px;
      background: #171a1f; color: #e8ecf1;
      font: 12px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
    .logo {
      width: 22px; height: 22px; border-radius: 6px; color: #fff; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #409eff, #36cfc9);
    }
    p { margin: 6px 0; color: #9aa5b1; }
    ol { margin: 8px 0 10px 18px; padding: 0; color: #b8c2cc; }
    li { margin: 3px 0; }
    button {
      width: 100%; padding: 8px 0; border: 0; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, #409eff, #2f7fe0); color: #fff;
      font: 600 12px/1 -apple-system, "PingFang SC", sans-serif;
      margin-top: 6px;
    }
    button.secondary { background: #2a3038; color: #c9d2dc; }
    button:hover { filter: brightness(1.08); }
    .msg { min-height: 16px; margin-top: 8px; font-size: 10.5px; color: #97dd75; }
    .msg.err { color: #ff8b8b; }
    .tip { margin-top: 8px; font-size: 10.5px; color: #66707c; }
  </style>
</head>
<body>
  <h1><span class="logo">▶</span>课程自动连播助手</h1>
  <p>仅对 hbnun.lsedu.vip 生效。默认自动连播全部课时；播放被拦截会自动刷新继续，全部完成后暂停。</p>
  <ol>
    <li>打开课程播放页；</li>
    <li>点页面左侧浮窗的“开始”；</li>
    <li>视频会拖到结尾并记录进度，然后自动进入下一节；被拦截时自动刷新续播，全部完成后暂停。</li>
  </ol>
  <button id="inject">重新注入到当前页</button>
  <button class="secondary" id="open">打开课程页</button>
  <div class="msg" id="msg"></div>
  <div class="tip">被拦截时会自动刷新并继续；连续 4 次仍失败则停下等待手动处理。</div>
  <script src="popup.js"></script>
</body>
</html>
