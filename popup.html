<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px; margin: 0; padding: 14px;
      background: #171a1f; color: #e8ecf1;
      font: 12px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
    .logo {
      width: 22px; height: 22px; border-radius: 6px; color: #fff; font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #409eff, #36cfc9);
    }
    h2 { margin: 14px 0 6px; font-size: 12px; color: #b8c2cc; font-weight: 600; }
    p { margin: 6px 0; color: #9aa5b1; }
    ol { margin: 8px 0 10px 18px; padding: 0; color: #b8c2cc; }
    li { margin: 3px 0; }
    button {
      width: 100%; padding: 8px 0; border: 0; border-radius: 8px; cursor: pointer;
      background: linear-gradient(135deg, #409eff, #2f7fe0); color: #fff;
      font: 600 12px/1 -apple-system, "PingFang SC", sans-serif;
      margin-top: 6px;
    }
    button.secondary { background: #2a3038; color: #c9d2dc; }
    button:hover { filter: brightness(1.08); }
    .msg { min-height: 16px; margin-top: 8px; font-size: 10.5px; color: #97dd75; }
    .msg.err { color: #ff8b8b; }
    .tip { margin-top: 8px; font-size: 10.5px; color: #66707c; }
    .stat { margin-top: 6px; padding: 8px; border-radius: 8px; background: #1e232a;
      color: #9fb0c2; font-size: 10.5px; }
    .stat b { color: #6cb6ff; }
    .divider { height: 1px; background: rgba(255,255,255,.08); margin: 14px 0 10px; }
  </style>
</head>
<body>
  <h1><span class="logo">▶</span>课程 / 考试助手</h1>

  <h2>考试自动答题</h2>
  <p>在考试页或作业页出现浮窗。流程：先提交一遍拿标准答案 → 再按答案提交一遍。</p>
  <ol>
    <li>在浏览器里登录 hbnun.lsedu.vip；</li>
    <li>打开“我的考试”或“我的作业”；</li>
    <li>在浮窗里选范围，点“开始”。</li>
  </ol>
  <button id="injectExam">注入到当前页（考试/作业页）</button>
  <button class="secondary" id="openExam">打开我的考试</button>
  <div class="stat" id="bankStat">答案库：读取中…</div>
  <button class="secondary" id="exportBank">导出答案库</button>

  <div class="divider"></div>

  <h2>课程自动连播</h2>
  <p>检测到视频播放后自动接管，每节 5~10 秒播完并连播全部课时。</p>
  <button class="secondary" id="inject">重新注入连播脚本</button>
  <button class="secondary" id="open">打开课程页</button>

  <div class="msg" id="msg"></div>
  <div class="tip">浮窗可拖动、收起；关闭浮窗后可用上面的按钮重新注入。</div>
  <script src="popup.js"></script>
</body>
</html>
